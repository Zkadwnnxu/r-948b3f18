name: Refresh catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      full_quality:
        description: Run the complete quality review now
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['catalog.json', 'scripts/**', 'tests/**', '.github/workflows/catalog.yml']
  pull_request:
    paths: ['catalog.json', 'scripts/**', 'tests/**', '.github/workflows/catalog.yml']
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - name: Prepare decoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Owned silent and certificate controls
        run: python3 tests/cloud_controls.py
  maintain:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: tooling
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: data
          path: published
          persist-credentials: false
      - name: Prepare decoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Check metadata
        run: python3 tooling/scripts/update.py --catalog tooling/catalog.json --output published --inspect-only
      - name: Check covers and due quality review
        env:
          FORCE_QUALITY: ${{ github.event_name == 'push' || github.event.inputs.full_quality == 'true' }}
        run: |
          if [ "$FORCE_QUALITY" = 'true' ]; then
            python3 tooling/scripts/quality.py --output published --force
          else
            python3 tooling/scripts/quality.py --output published
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-data
          retention-days: 2
          if-no-files-found: error
          path: |
            published/vod.json
            published/health.json
            published/selection.json
            published/automatic.json
            published/covers.json
  publish:
    needs: maintain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: generated-data
          path: generated
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: data
          path: published
      - name: Validate data and copy allowed files
        run: |
          python3 - <<'PY'
          import json, pathlib, shutil
          source = pathlib.Path('generated')
          target = pathlib.Path('published')
          allowed = {'vod.json', 'health.json', 'selection.json', 'automatic.json', 'covers.json'}
          for path in source.iterdir():
              if path.name not in allowed or not path.is_file() or path.is_symlink():
                  raise ValueError('Unexpected generated file')
              body = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(body, dict): raise ValueError('Invalid generated JSON')
          vod = json.loads((source / 'vod.json').read_text(encoding='utf-8'))
          if not vod.get('sites') or any(s.get('type') != 1 or not s.get('api', '').startswith(('https://', 'http://')) for s in vod['sites']):
              raise ValueError('Invalid publication')
          for path in source.iterdir(): shutil.copyfile(path, target / path.name)
          PY
      - name: Publish generated data only
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vod.json health.json selection.json
          for filename in automatic.json covers.json; do
            if [ -f "$filename" ]; then git add "$filename"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh reviewed configuration'
            git push origin HEAD:data
          fi
