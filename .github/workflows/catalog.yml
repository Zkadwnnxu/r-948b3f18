name: Refresh catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['catalog.json', 'scripts/**', 'tests/**', '.github/workflows/catalog.yml']
  pull_request:
    paths: ['catalog.json', 'scripts/**', 'tests/**', '.github/workflows/catalog.yml']
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
  maintain:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: tooling
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: data
          path: published
      - name: Check metadata without playback
        run: python3 tooling/scripts/update.py --catalog tooling/catalog.json --output published
      - name: Publish generated data only
        working-directory: published
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vod.json health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh CMS metadata health and public catalog'
            git push origin HEAD:data
          fi
